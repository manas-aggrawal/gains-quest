  --amber:     #ffcc33;   /* accents, streak, warnings */
  --magenta:   #ff3c78;   /* danger: reset controls */

  --px: 4px;              /* the "pixel" unit — all borders are multiples */
  --tap: 56px;            /* minimum tap target */
  --head: 'Press Start 2P', 'Courier New', ui-monospace, monospace;
  --body: ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

html,body{ background:var(--bg); }

body{
  font-family:var(--body);
  color:var(--green);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
  /* Hard pixel edges everywhere: no smoothing, no rounding. */
  image-rendering:pixelated;
  text-rendering:geometricPrecision;
}

/* Screen-shake wrapper — used for the WORLD CLEAR celebration. */
#screen{ position:relative; }
#screen.shake{ animation:shake .38s steps(2,end) 3; }
@keyframes shake{
  0%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)}
  50%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,-3px)}
  100%{transform:translate(0,0)}
}

/* ---------- CRT scanline overlay (faint, toggleable) ---------- */
#crt{
  position:fixed; inset:0; z-index:90; pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,.15) 0px, rgba(0,0,0,.15) 1px,
    rgba(0,0,0,0)   1px, rgba(0,0,0,0)   3px
  );
  mix-blend-mode:multiply;
}
body.no-crt #crt{ display:none; }

/* ---------- Shared blocky chrome ---------- */
.wrap{ max-width:640px; margin:0 auto; padding:12px 12px 48px; }

h1,h2,h3,.head,.btn,.tab,.badge,.bar-label{
  font-family:var(--head);
  letter-spacing:.5px;
  text-transform:uppercase;
}

/* ---------- Header ---------- */
header{
  border:var(--px) solid var(--green);
  background:var(--panel);
  padding:12px;
  margin-bottom:12px;
  box-shadow:var(--px) var(--px) 0 var(--green-dim);
}
.title{
  font-family:var(--head);
  font-size:15px; color:var(--green); line-height:1.6;
  text-shadow:2px 2px 0 var(--green-dim);
}
/* Press Start 2P is ~1em wide per glyph, so this long line needs a small
   size to clear a 360px phone without wrapping awkwardly. */
.subtitle{
  font-family:var(--head);
  font-size:7px; color:var(--green-dim); margin-top:8px;
  letter-spacing:1px; line-height:1.8;
}

.hud{
  display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:stretch;
}
.stat{
  flex:1 1 0; min-width:66px;   /* four across on a 360px phone */
  border:var(--px) solid var(--green-dim);
  background:var(--panel-2);
  padding:8px 6px; text-align:center;
}
.stat .k{ font-family:var(--head); font-size:7px; color:var(--green-dim); display:block; }
.stat .v{ font-family:var(--head); font-size:16px; color:var(--amber); display:block; margin-top:6px; }

/* Toggle buttons (sound / scanlines) */
.toggles{ display:flex; gap:8px; margin-top:10px; }
.toggle{
  flex:1; min-height:44px;
  font-family:var(--head); font-size:8px;
  color:var(--green); background:var(--panel-2);
  border:var(--px) solid var(--green-dim);
  cursor:pointer; padding:6px 4px;
}
.toggle[aria-pressed="true"]{ color:var(--bg); background:var(--green); border-color:var(--green); }
.toggle:active{ transform:translate(1px,1px); }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:8px; margin-bottom:12px; }
.tab{
  flex:1; min-height:var(--tap);
  font-size:10px; color:var(--green-dim);
  background:var(--panel-2);
  border:var(--px) solid var(--green-dim);
  cursor:pointer;
}
.tab[aria-selected="true"]{
  color:var(--bg); background:var(--green); border-color:var(--green);
  box-shadow:var(--px) var(--px) 0 var(--green-dim);
}

/* ---------- Week progress (days done / total) ---------- */
.weekbox{
  border:var(--px) solid var(--amber);
  background:var(--panel);
  padding:12px; margin-bottom:14px;
  box-shadow:var(--px) var(--px) 0 #6b5210;
}
.weekbox.cleared{ border-color:var(--green); box-shadow:var(--px) var(--px) 0 var(--green-dim); }
.bar-label{
  font-size:9px; color:var(--amber);
  display:flex; justify-content:space-between; gap:8px; margin-bottom:8px;
}

/* Segmented retro XP/health bar. Each segment = one unit of progress. */
.bar{
  display:flex; gap:3px; height:20px;
  border:var(--px) solid var(--green-dim);
  background:var(--panel-2); padding:3px;
}
.bar.week{ height:26px; border-color:var(--amber); }
.seg{ flex:1; background:var(--green-dim); opacity:.45; transition:none; }
.seg.on{ background:var(--green); opacity:1; }
.bar.week .seg.on{ background:var(--amber); }
.seg.pop{ animation:segpop .2s steps(2,end); }
@keyframes segpop{ 0%{transform:scaleY(.2)} 100%{transform:scaleY(1)} }

/* ---------- Day (stage) cards ---------- */
.day{
  border:var(--px) solid var(--green-dim);
  background:var(--panel);
  margin-bottom:14px;
  position:relative;
}
.day.done{ border-color:var(--green); box-shadow:var(--px) var(--px) 0 var(--green-dim); }

.day-head{ padding:12px; border-bottom:var(--px) solid var(--green-dim); }
.day.done .day-head{ border-bottom-color:var(--green); }
.day-title{
  font-family:var(--head); font-size:11px; color:var(--white);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.day-num{ color:var(--green-dim); }
.day.done .day-title{ color:var(--green); }
.badge{
  font-size:8px; padding:4px 6px; margin-left:auto;
  border:2px solid var(--green-dim); color:var(--green-dim); white-space:nowrap;
}
.day.done .badge{ border-color:var(--green); color:var(--bg); background:var(--green); }
.day-bar{ margin-top:10px; }

/* Exercise rows — the ONLY tappable completion control. */
.ex{
  display:flex; align-items:flex-start; gap:12px;
  padding:10px 12px; min-height:var(--tap);
  border-bottom:2px solid rgba(29,92,42,.4);
  cursor:pointer; user-select:none;
}
.ex:last-child{ border-bottom:none; }
.ex:active{ background:rgba(70,232,70,.07); }

/* Pixel-art checkbox: thick square that fills solid when ticked.
   The tick itself is a checkmark drawn on a 5x4 grid of 4px blocks using
   box-shadow — no SVG, no font glyph, so the edges stay perfectly hard. */
.box{
  flex:none; width:32px; height:32px; margin-top:2px;
  border:var(--px) solid var(--green);
  background:var(--panel-2);
  display:grid; place-items:center;
}
.box i{ display:block; width:4px; height:4px; background:transparent; }
.ex.done .box{ background:var(--green); }
.ex.done .box i{
  background:var(--bg);
  /* base block = grid cell (col 0,row 1); shadows lay out the rest */
  box-shadow:
      0    4px 0 0 var(--bg),   /* 0,2 */
      4px  4px 0 0 var(--bg),   /* 1,2 */
      4px  8px 0 0 var(--bg),   /* 1,3 */
      8px  4px 0 0 var(--bg),   /* 2,2 */
      8px  8px 0 0 var(--bg),   /* 2,3 */
     12px    0 0 0 var(--bg),   /* 3,1 */
     12px  4px 0 0 var(--bg),   /* 3,2 */
     16px -4px 0 0 var(--bg),   /* 4,0 */
     16px    0 0 0 var(--bg);   /* 4,1 */
  /* re-centre the 20x16 glyph over the box, then pop it in */
  transform:translate(-8px,-2px);
  animation:fill .16s steps(3,end);
}
@keyframes fill{
  from{ transform:translate(-8px,-2px) scale(.2) }
  to  { transform:translate(-8px,-2px) scale(1) }
}

.ex-main{ flex:1; min-width:0; }
.ex-name{
  font-family:var(--head); font-size:10px; line-height:1.6;
  color:var(--white); word-break:break-word;
}
.ex.done .ex-name{ color:var(--green-dim); text-decoration:line-through; }
/* Read-only reference label — sets x reps, never tappable. */
.ex-scheme{ font-size:12px; color:var(--green); opacity:.8; margin-top:3px; letter-spacing:.5px; }
.ex.done .ex-scheme{ opacity:.4; }

/* Note toggle button — small, secondary, out of the way. */
.note-btn{
  flex:none; width:44px; min-height:44px; margin-top:0;
  font-family:var(--head); font-size:11px;
  color:var(--green-dim); background:transparent;
  border:2px solid var(--green-dim); cursor:pointer;
}
.note-btn.has{ color:var(--amber); border-color:var(--amber); }
.note-wrap{ padding:0 12px 10px 54px; display:none; }
.note-wrap.open{ display:block; }
.note-wrap input{
  width:100%; min-height:44px; padding:8px;
  font-family:var(--body); font-size:14px;
  color:var(--amber); background:var(--panel-2);
  border:2px solid var(--green-dim); outline:none;
}
.note-wrap input:focus{ border-color:var(--amber); }
.note-wrap input::placeholder{ color:var(--green-dim); }

/* STAGE CLEAR flash, drawn over its own day card. */
.stage-flash{
  position:absolute; inset:0; z-index:20;
  display:grid; place-items:center;
  background:rgba(13,13,20,.86);
  font-family:var(--head); font-size:14px; color:var(--green);
  pointer-events:none;
  animation:stageflash .95s steps(1,end) forwards;
}
@keyframes stageflash{
  0%,20%,40%  { opacity:1; color:var(--green); }
  10%,30%     { opacity:1; color:var(--white); }
  85%         { opacity:1; }
  100%        { opacity:0; }
}

/* ---------- WORLD CLEAR overlay ---------- */
#world{
  position:fixed; inset:0; z-index:100;
  display:none; place-items:center; padding:20px;
  background:rgba(13,13,20,.95);
}
#world.on{ display:grid; }
.world-card{
  border:var(--px) solid var(--amber);
  background:var(--panel); padding:22px 18px; text-align:center;
  max-width:420px; width:100%;
  box-shadow:var(--px) var(--px) 0 #6b5210;
}
.world-title{
  font-family:var(--head); font-size:19px; line-height:1.7;
  animation:blinkcolor .4s steps(1,end) infinite;
}
@keyframes blinkcolor{
  0%{ color:var(--amber) } 33%{ color:var(--green) } 66%{ color:var(--white) }
}
.world-sub{ font-family:var(--head); font-size:9px; color:var(--green); margin-top:14px; line-height:2; }
.world-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }

/* ---------- Buttons ---------- */
.btn{
  min-height:var(--tap); width:100%;
  font-family:var(--head); font-size:10px; line-height:1.6;
  color:var(--bg); background:var(--green);
  border:var(--px) solid var(--green);
  box-shadow:var(--px) var(--px) 0 var(--green-dim);
  cursor:pointer; padding:10px;
}
.btn:active{ transform:translate(var(--px),var(--px)); box-shadow:none; }
.btn.ghost{ color:var(--green); background:transparent; border-color:var(--green-dim); box-shadow:none; }
.btn.danger{ color:var(--magenta); background:transparent; border-color:var(--magenta); box-shadow:none; }
.btn.danger-solid{ color:var(--bg); background:var(--magenta); border-color:var(--magenta); box-shadow:var(--px) var(--px) 0 #7a1c39; }

/* ---------- History ---------- */
.hist-item{
  border:var(--px) solid var(--green-dim);
  background:var(--panel); margin-bottom:12px;
}
.hist-head{
  padding:12px; cursor:pointer;
  display:flex; align-items:center; gap:10px; min-height:var(--tap);
}
.hist-world{ font-family:var(--head); font-size:11px; color:var(--amber); }
.hist-date{ font-size:12px; color:var(--green); opacity:.7; margin-top:4px; }
.hist-caret{ margin-left:auto; font-family:var(--head); font-size:12px; color:var(--green-dim); }
.hist-body{ display:none; padding:0 12px 12px; border-top:2px solid var(--green-dim); }
.hist-body.open{ display:block; }
.hist-day{ margin-top:12px; }
.hist-day h4{ font-family:var(--head); font-size:9px; color:var(--white); margin-bottom:6px; }
.hist-ex{ font-size:12px; padding:3px 0 3px 10px; border-left:2px solid var(--green-dim); }
.hist-ex .n{ color:var(--green); }
.hist-ex .note{ color:var(--amber); }

/* ---------- System / reset section (clearly separated) ---------- */
.system{
  margin-top:34px; padding-top:18px;
  border-top:var(--px) dashed var(--magenta);
}
.system h3{ font-size:9px; color:var(--magenta); margin-bottom:12px; }
.system .btn{ margin-bottom:10px; }
.hint{ font-size:11px; color:var(--green-dim); line-height:1.7; margin-bottom:14px; }

/* ---------- Confirm modal ---------- */
#confirm{ position:fixed; inset:0; z-index:110; display:none; place-items:center; padding:20px;
  background:rgba(13,13,20,.95); }
#confirm.on{ display:grid; }
.confirm-card{
  border:var(--px) solid var(--magenta); background:var(--panel);
  padding:20px; max-width:400px; width:100%;
  box-shadow:var(--px) var(--px) 0 #7a1c39;
}
.confirm-card h3{ font-size:12px; color:var(--magenta); line-height:1.7; margin-bottom:12px; }
.confirm-card p{ font-size:13px; color:var(--white); margin-bottom:18px; line-height:1.6; }
.confirm-actions{ display:flex; flex-direction:column; gap:10px; }

.empty{ text-align:center; padding:40px 16px; font-size:13px; color:var(--green-dim); line-height:2; }

/* Respect reduced-motion: keep the app usable, drop the flashing. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  #screen.shake{ animation:none; }
}
</style>
</head>
<body>

<div id="crt"></div>

<div id="screen">
  <div class="wrap">

    <header>
      <div class="title">GAINS QUEST</div>
      <div class="subtitle">UPPER / LOWER &mdash; 4 STAGE CAMPAIGN</div>

      <div class="hud">
        <div class="stat"><span class="k">World</span><span class="v" id="hud-week">1</span></div>
        <div class="stat"><span class="k">Streak</span><span class="v" id="hud-streak">0</span></div>
        <div class="stat"><span class="k">Best</span><span class="v" id="hud-best">0</span></div>
        <div class="stat"><span class="k">Cleared</span><span class="v" id="hud-cleared">0</span></div>
      </div>

      <div class="toggles">
        <button class="toggle" id="t-sound" aria-pressed="true">&#9835; SOUND</button>
        <button class="toggle" id="t-crt"   aria-pressed="true">&#9707; SCANLINES</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab" id="tab-play" aria-selected="true">&#9654; Current World</button>
      <button class="tab" id="tab-hist" aria-selected="false">&#9733; Cleared Worlds</button>
    </div>

    <!-- ================= CURRENT WEEK ================= -->
    <section id="view-play">
      <div class="weekbox" id="weekbox">
        <div class="bar-label">
          <span id="week-label">WORLD 1</span>
          <span id="week-count">0/4 STAGES</span>
        </div>
        <div class="bar week" id="week-bar"></div>
      </div>

      <div id="days"></div>

      <!-- System controls, deliberately below the fold and colour-separated -->
      <div class="system">
        <h3>&#9888; System</h3>
        <p class="hint">
          Reset current world clears every tick and note in the world you're
          playing now. History and streak are untouched.
        </p>
        <button class="btn danger" id="btn-reset-week">Reset Current World</button>
        <button class="btn danger" id="btn-reset-all">Erase All Data</button>
      </div>
    </section>

    <!-- ================= HISTORY ================= -->
    <section id="view-hist" hidden>
      <div id="hist-list"></div>
    </section>

  </div>
</div>

<!-- WORLD CLEAR celebration -->
<div id="world" role="dialog" aria-modal="true">
  <div class="world-card">
    <div class="world-title">WORLD<br>CLEAR!</div>
    <div class="world-sub" id="world-sub">WORLD 1 COMPLETE<br>STREAK &times; 1</div>
    <div class="world-actions">
      <button class="btn" id="btn-next-world">&#9654; Start Next World</button>
      <button class="btn ghost" id="btn-not-yet">&#8617; Back (fix a tick)</button>
    </div>
  </div>
</div>

<!-- Confirm modal for destructive actions -->
<div id="confirm" role="dialog" aria-modal="true">
  <div class="confirm-card">
    <h3 id="confirm-title">Are you sure?</h3>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button class="btn danger-solid" id="confirm-yes">Yes, do it</button>
      <button class="btn ghost" id="confirm-no">Cancel</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   GAINS QUEST — offline single-file workout tracker.
   State lives entirely in localStorage. No network, no backend.

   Hierarchy: Week (world) > Day (stage) > Exercise (task).
   Only exercises are tappable; day + week completion are DERIVED from them,
   so completion cascades upward and un-ticking ripples back down for free.
   ========================================================================= */

/* ---------------------------------------------------------------- PROGRAM */
/* [ exercise name, sets x reps reference label ] */
const PROGRAM = [
  { name:'UPPER A', exercises:[
    ['Incline DB Press',              '3 × 6–10'],
    ['Chest-Supported Row (straps)',  '3 × 8–12'],
    ['Lateral Raise',                 '3 × 12–20'],
    ['Rope Face Pull',                '3 × 15–20'],
    ['Hammer Curl',                   '3 × 8–12'],
    ['Rope Pushdown',                 '3 × 10–15'],
  ]},
  { name:'LOWER A', exercises:[
    ['Hack Squat / Leg Press',        '3 × 8–12'],
    ['Romanian Deadlift',             '3 × 8–12'],
    ['Bulgarian Split Squat',         '2–3 × 8–12'],
    ['DB Shrug',                      '3 × 10–15'],
    ['Standing Calf Raise',           '3 × 10–15'],
  ]},
  { name:'UPPER B', exercises:[
    ['Seated DB Shoulder Press / Landmine Press', '3 × 6–10'],
    ['Lat Pulldown / Pull-up (straps)',           '3 × 8–12'],
    ['Lateral Raise',                             '3 × 12–20'],
    ['Reverse Pec Deck (rear delt)',              '3 × 12–20'],
    ['Incline DB Curl',                           '3 × 8–12'],
    ['Overhead Cable Triceps Ext',                '3 × 10–15'],
  ]},
  { name:'LOWER B', exercises:[
    ['Leg Press',                                  '3 × 8–12'],
    ['Cable Pull-Through',                         '3 × 10–15'],
    ['Walking Lunge / Bulgarian Split Squat',      '2 × 10–12'],
    ['Barbell/DB Shrug',                           '3 × 10–15'],
    ['Seated Calf Raise',                          '3 × 12–15'],
  ]},
];

/* ------------------------------------------------------------------ STATE */
const KEY = 'gains-quest-v1';

/** Build a blank week from PROGRAM. `done` and `note` are the only mutable bits. */
function freshWeek(number){
  return {
    number,
    startedAt: new Date().toISOString(),
    days: PROGRAM.map(d => ({
      name: d.name,
      exercises: d.exercises.map(([name, scheme]) => ({ name, scheme, done:false, note:'' }))
    }))
  };
}

function defaultState(){
  return {
    version: 1,
    sound: true,
    crt: true,
    streak: 0,
    best: 0,
    lastClearedAt: null,   // ISO string — used for streak gap detection
    week: freshWeek(1),
    history: []            // newest first
  };
}

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    // Shallow-merge so a partial/old save still boots.
    const merged = Object.assign(d, s);
    // If PROGRAM changed shape since the save, rebuild the week but carry
    // over ticks + notes for exercises whose (day, name) still match.
    merged.week = reconcileWeek(merged.week);
    return merged;
  }catch(e){
    console.warn('Save was unreadable, starting fresh.', e);
    return defaultState();
  }
}

/** Keep saved progress when the hard-coded PROGRAM is edited. */
function reconcileWeek(saved){
  const fresh = freshWeek(saved && saved.number ? saved.number : 1);
  if(saved && saved.startedAt) fresh.startedAt = saved.startedAt;
  if(!saved || !Array.isArray(saved.days)) return fresh;
  fresh.days.forEach((day, di) => {
    const old = saved.days[di];
    if(!old || !Array.isArray(old.exercises)) return;
    day.exercises.forEach(ex => {
      const match = old.exercises.find(o => o && o.name === ex.name);
      if(match){ ex.done = !!match.done; ex.note = match.note || ''; }
    });
  });
  return fresh;
}

let saveTimer = null;
/** save(true) writes now; save() coalesces bursts (used by the note field's keystrokes). */
function save(immediate){
  clearTimeout(saveTimer);
  const write = () => {
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ console.warn('Could not save.', e); }
  };
  if(immediate) write(); else saveTimer = setTimeout(write, 120);
}
// Belt and braces: flush any pending save if the tab is backgrounded/closed.
addEventListener('pagehide', () => save(true));
addEventListener('visibilitychange', () => { if(document.hidden) save(true); });

/* -------------------------------------------------------- DERIVED HELPERS */
const dayDoneCount = d => d.exercises.filter(e => e.done).length;
const dayIsDone    = d => d.exercises.length > 0 && d.exercises.every(e => e.done);
const weekDoneDays = w => w.days.filter(dayIsDone).length;
const weekIsDone   = w => w.days.every(dayIsDone);

/* -------------------------------------------------------------- 8-BIT SFX */
/* All sound is generated with the Web Audio API — no audio files. */
let actx = null;
function audio(){
  if(!state.sound) return null;
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }
  if(actx.state === 'suspended') actx.resume();
  return actx;
}

/** One square-wave note. Square waves + hard gain envelopes = NES timbre. */
function note(freq, startOffset, dur, type, vol){
  const ac = audio(); if(!ac) return;
  const t0 = ac.currentTime + startOffset;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

const sfx = {
  tick:   () => { note(880, 0, .07); note(1320, .05, .07); },
  untick: () => { note(330, 0, .07); note(220,  .05, .09); },
  stage:  () => { [523,659,784,1047].forEach((f,i) => note(f, i*.07, .12)); },
  world:  () => {                       // short fanfare
    const seq = [523,659,784,1047,784,1047,1319];
    seq.forEach((f,i) => note(f, i*.11, .16, 'square', .18));
    note(1568, seq.length*.11, .5, 'square', .2);
  },
  ui:     () => note(660, 0, .05, 'square', .1)
};

/* ----------------------------------------------------------------- RENDER */
const $ = id => document.getElementById(id);
const daysEl = $('days');

/* DOM references, rebuilt whenever a new week starts. */
let refs = { days: [] };
/* Snapshot of completion so we only fire celebrations on the transition
   from incomplete -> complete (not on every re-render). */
let wasDayDone = [];
let wasWeekDone = false;

/** Build a segmented progress bar with `total` segments. */
function buildBar(el, total){
  el.innerHTML = '';
  const segs = [];
  for(let i=0;i<total;i++){
    const s = document.createElement('div');
    s.className = 'seg';
    el.appendChild(s);
    segs.push(s);
  }
  return segs;
}

function buildWeek(){
  daysEl.innerHTML = '';
  refs = { days: [] };

  state.week.days.forEach((day, di) => {
    const card = document.createElement('div');
    card.className = 'day';

    // --- header: stage name, x/y badge, progress bar
    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML =
      '<div class="day-title"><span class="day-num">' + (di+1) + '-</span>' +
      '<span>' + day.name + '</span>' +
      '<span class="badge"></span></div>' +
      '<div class="bar day-bar"></div>';
    card.appendChild(head);

    const badge = head.querySelector('.badge');
    const segs  = buildBar(head.querySelector('.day-bar'), day.exercises.length);

    // --- exercise rows
    const rows = day.exercises.map((ex, ei) => {
      const row = document.createElement('div');
      row.className = 'ex';
      row.innerHTML =
        '<div class="box"><i></i></div>' +
        '<div class="ex-main">' +
          '<div class="ex-name"></div>' +
          '<div class="ex-scheme"></div>' +
        '</div>' +
        '<button class="note-btn" type="button" title="Log weight x reps">&#9660;</button>';
      row.querySelector('.ex-name').textContent   = ex.name;
      row.querySelector('.ex-scheme').textContent = ex.scheme;

      // Optional weight x reps field, collapsed by default.
      // ---- REMOVE-NOTES: delete this block + the .note-btn markup above to drop the feature.
      const noteWrap = document.createElement('div');
      noteWrap.className = 'note-wrap';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'e.g. 22.5kg × 9';
      input.value = ex.note || '';
      input.setAttribute('aria-label', ex.name + ' weight and reps');
      noteWrap.appendChild(input);

      const noteBtn = row.querySelector('.note-btn');
      noteBtn.addEventListener('click', e => {
        e.stopPropagation();               // never toggles the exercise
        const open = noteWrap.classList.toggle('open');
        noteBtn.innerHTML = open ? '&#9650;' : '&#9660;';
        if(open){ input.focus(); sfx.ui(); }
      });
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('input', () => {
        ex.note = input.value;
        noteBtn.classList.toggle('has', !!input.value.trim());
        save();
      });
      noteBtn.classList.toggle('has', !!(ex.note && ex.note.trim()));
      // ---- /REMOVE-NOTES

      // The whole row is the tap target.
      row.addEventListener('click', () => toggleExercise(di, ei));

      card.appendChild(row);
      card.appendChild(noteWrap);
      return row;
    });

    daysEl.appendChild(card);
    refs.days.push({ card, badge, segs, rows });
  });

  refs.weekSegs = buildBar($('week-bar'), state.week.days.length);
  wasDayDone  = state.week.days.map(dayIsDone);
  wasWeekDone = weekIsDone(state.week);
  paint();
}

/** Sync all visuals to state. Cheap enough to call on every tap. */
function paint(){
  const w = state.week;

  state.week.days.forEach((day, di) => {
    const r = refs.days[di];
    const doneN = dayDoneCount(day);
    const done  = dayIsDone(day);

    day.exercises.forEach((ex, ei) => r.rows[ei].classList.toggle('done', ex.done));
    r.segs.forEach((s, i) => s.classList.toggle('on', i < doneN));
    r.badge.textContent = done ? 'CLEAR' : doneN + '/' + day.exercises.length;
    r.card.classList.toggle('done', done);
  });

  const wd = weekDoneDays(w);
  refs.weekSegs.forEach((s, i) => s.classList.toggle('on', i < wd));
  $('week-label').textContent = 'WORLD ' + w.number;
  $('week-count').textContent = wd + '/' + w.days.length + ' STAGES';
  $('weekbox').classList.toggle('cleared', wd === w.days.length);

  $('hud-week').textContent    = w.number;
  $('hud-streak').textContent  = state.streak;
  $('hud-best').textContent    = state.best;
  $('hud-cleared').textContent = state.history.length;
}

/* ------------------------------------------------------------- INTERACTION */
function toggleExercise(di, ei){
  const day = state.week.days[di];
  const ex  = day.exercises[ei];
  ex.done = !ex.done;
  save(true);   // ticks are the important data — write them synchronously
  paint();

  ex.done ? sfx.tick() : sfx.untick();

  // Cascade check: day first, then week. Only fire on a fresh transition.
  const dDone = dayIsDone(day);
  if(dDone && !wasDayDone[di]) stageClear(di);
  wasDayDone[di] = dDone;

  const wDone = weekIsDone(state.week);
  if(wDone && !wasWeekDone) worldClear();
  wasWeekDone = wDone;
}

/** Short "STAGE CLEAR" flash over the finished day card. */
function stageClear(di){
  sfx.stage();
  const card = refs.days[di].card;
  const flash = document.createElement('div');
  flash.className = 'stage-flash';
  flash.textContent = 'STAGE CLEAR';
  card.appendChild(flash);
  setTimeout(() => flash.remove(), 1000);
}

/** Big celebration. Archiving is deferred to the button so un-ticking stays possible. */
function worldClear(){
  sfx.world();
  const nextStreak = projectedStreak();
  $('world-sub').innerHTML =
    'WORLD ' + state.week.number + ' COMPLETE<br>STREAK &times; ' + nextStreak;
  $('world').classList.add('on');
  const s = $('screen');
  s.classList.add('shake');
  setTimeout(() => s.classList.remove('shake'), 1200);
}

/**
 * Streak = consecutive weeks cleared. If more than 14 days have passed since
 * the last clear, a calendar week was missed, so the streak restarts at 1.
 */
function projectedStreak(){
  if(!state.lastClearedAt) return 1;
  const gapDays = (Date.now() - new Date(state.lastClearedAt).getTime()) / 86400000;
  return gapDays > 14 ? 1 : state.streak + 1;
}

/** Archive the finished week and roll a brand-new one. */
function startNextWorld(){
  const now = new Date();
  state.streak = projectedStreak();
  state.best   = Math.max(state.best, state.streak);
  state.lastClearedAt = now.toISOString();

  state.history.unshift({
    number: state.week.number,
    startedAt: state.week.startedAt,
    clearedAt: now.toISOString(),
    days: state.week.days.map(d => ({
      name: d.name,
      exercises: d.exercises.map(e => ({ name:e.name, scheme:e.scheme, note:e.note || '' }))
    }))
  });

  state.week = freshWeek(state.week.number + 1);
  save(true);
  $('world').classList.remove('on');
  buildWeek();
  renderHistory();
  sfx.ui();
}

/* --------------------------------------------------------------- HISTORY */
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
}

function renderHistory(){
  const list = $('hist-list');
  list.innerHTML = '';

  if(!state.history.length){
    list.innerHTML =
      '<div class="empty">NO WORLDS CLEARED YET.<br>&#9654; GO LIFT SOMETHING.</div>';
    return;
  }

  state.history.forEach(h => {
    const item = document.createElement('div');
    item.className = 'hist-item';

    const head = document.createElement('div');
    head.className = 'hist-head';
    head.innerHTML =
      '<div><div class="hist-world">WORLD ' + h.number + ' CLEAR</div>' +
      '<div class="hist-date">' + fmtDate(h.clearedAt) + '</div></div>' +
      '<div class="hist-caret">&#9660;</div>';

    const body = document.createElement('div');
    body.className = 'hist-body';
    body.innerHTML = h.days.map(d =>
      '<div class="hist-day"><h4>' + escapeHtml(d.name) + '</h4>' +
      d.exercises.map(e =>
        '<div class="hist-ex"><span class="n">' + escapeHtml(e.name) + '</span> ' +
        '<span style="opacity:.6">' + escapeHtml(e.scheme) + '</span>' +
        (e.note ? ' <span class="note">&rarr; ' + escapeHtml(e.note) + '</span>' : '') +
        '</div>'
      ).join('') + '</div>'
    ).join('');

    head.addEventListener('click', () => {
      const open = body.classList.toggle('open');
      head.querySelector('.hist-caret').innerHTML = open ? '&#9650;' : '&#9660;';
      sfx.ui();
    });

    item.appendChild(head);
    item.appendChild(body);
    list.appendChild(item);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ------------------------------------------------------- CONFIRM MODAL */
let confirmAction = null;
function ask(title, bodyText, onYes){
  $('confirm-title').textContent = title;
  $('confirm-body').textContent  = bodyText;
  confirmAction = onYes;
  $('confirm').classList.add('on');
}
$('confirm-yes').addEventListener('click', () => {
  $('confirm').classList.remove('on');
  if(confirmAction) confirmAction();
  confirmAction = null;
});
$('confirm-no').addEventListener('click', () => {
  $('confirm').classList.remove('on');
  confirmAction = null;
  sfx.ui();
});

/* ------------------------------------------------------------ CONTROLS */
$('btn-reset-week').addEventListener('click', () =>
  ask('Reset current world?',
      'Every tick and note in World ' + state.week.number +
      ' will be cleared. Your history and streak stay put.',
      () => {
        state.week = freshWeek(state.week.number);
        save(true);
        buildWeek();
      })
);

$('btn-reset-all').addEventListener('click', () =>
  ask('Erase everything?',
      'This deletes all ' + state.history.length +
      ' cleared world(s), your streak, and the current world. It cannot be undone.',
      () => {
        const keep = { sound: state.sound, crt: state.crt };
        state = defaultState();
        state.sound = keep.sound; state.crt = keep.crt;
        save(true);
        buildWeek();
        renderHistory();
        applySettings();
      })
);

$('btn-next-world').addEventListener('click', startNextWorld);
$('btn-not-yet').addEventListener('click', () => {
  // Lets the user un-tick something without archiving the week.
  $('world').classList.remove('on');
  sfx.ui();
});

/* Tabs */
function showTab(which){
  const play = which === 'play';
  $('view-play').hidden = !play;
  $('view-hist').hidden =  play;
  $('tab-play').setAttribute('aria-selected', String(play));
  $('tab-hist').setAttribute('aria-selected', String(!play));
  if(!play) renderHistory();
  sfx.ui();
  scrollTo(0, 0);
}
$('tab-play').addEventListener('click', () => showTab('play'));
$('tab-hist').addEventListener('click', () => showTab('hist'));

/* Sound + scanline toggles */
$('t-sound').addEventListener('click', () => {
  state.sound = !state.sound; save(true); applySettings();
  if(state.sound) sfx.ui();
});
$('t-crt').addEventListener('click', () => {
  state.crt = !state.crt; save(true); applySettings(); sfx.ui();
});

function applySettings(){
  $('t-sound').setAttribute('aria-pressed', String(state.sound));
  $('t-crt').setAttribute('aria-pressed', String(state.crt));
  document.body.classList.toggle('no-crt', !state.crt);
}

/* ------------------------------------------------------------- BOOT */
applySettings();
buildWeek();
renderHistory();

/**
 * Ask the browser to exempt our data from automatic eviction.
 *
 * Without this, localStorage is "best effort": a browser under storage
 * pressure is allowed to clear it for sites it deems unimportant. Chrome
 * generally grants persistence outright once the app is installed to the home
 * screen. If it declines, nothing breaks — saving works exactly the same, the
 * data is just theoretically evictable.
 */
async function requestPersistence(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    if(await navigator.storage.persisted()) return;   // already granted
    await navigator.storage.persist();
  }catch(e){
    /* Unsupported browser — saving is unaffected. */
  }
}
requestPersistence();

/* Service worker: only registers when served over http(s). Opening the file
   directly still works fully offline — everything is inline. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
