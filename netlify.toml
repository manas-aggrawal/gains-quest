# Netlify config for continuous deploys from GitHub.
# There is no build step — the site is plain static files at the repo root.

[build]
  publish = "."
  command = ""

# The service worker serves everything cache-first, which is what makes the app
# work offline. The flip side: if sw.js itself gets cached, a new deploy can
# never announce itself and the phone keeps running the old version forever.
# These two files must always be revalidated so updates can land.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons are content-addressed by name and change rarely; let them cache hard.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
